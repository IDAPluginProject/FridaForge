name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -v
      - name: Compile host adapters
        run: >
          python -m py_compile
          __init__.py hosts/binja/__init__.py hosts/binja/backend_binja.py
          hosts/ida/ida_entry.py hosts/ida/backend_ida.py
          hosts/ghidra/backend_ghidra.py
          hosts/ghidra/generate_function_hook.py
          hosts/ghidra/generate_dlopen_hooks.py
          hosts/ghidra/modify_section_protection.py
          hosts/ghidra/negate_cond_branch_arm64.py
          hosts/ghidra/negate_cond_branch_x86.py
      - name: Build package
        run: |
          pip install build
          python -m build --outdir dist/pkg
      - name: Check wheel contents
        run: python build/check_wheel.py dist/pkg/*.whl
