[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fridaforge"
dynamic = ["version"]
description = "Generate Frida scripts from IDA Pro, Binary Ninja, and Ghidra"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "noobexon1" }]
requires-python = ">=3.10"
keywords = ["frida", "binary-ninja", "ida-pro", "ghidra", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/noobexon1/FridaForge"
Issues = "https://github.com/noobexon1/FridaForge/issues"

[tool.setuptools.dynamic]
version = { attr = "fridaforge._version.__version__" }

[tool.setuptools.packages.find]
include = ["fridaforge*"]

[tool.setuptools.package-data]
fridaforge = ["templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
